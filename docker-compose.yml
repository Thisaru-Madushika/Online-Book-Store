version: '3.8' # Docker compose version

services:
  # MongoDB database for Book Service
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped

  # Redis for API Gateway Rate Limiting
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Our custom Book Service application
  book-service:
    build:
      context: ./book-service
    container_name: book-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/bookdb
    depends_on:
      - mongodb
    restart: unless-stopped

  # Our custom API Gateway application
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8081:8081"
    environment:
      # Route configurations for Book Service
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ID=book-service
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://book-service:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/api/books/**
      # Redis connection for Rate Limiting
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - book-service
      - redis
    restart: unless-stopped